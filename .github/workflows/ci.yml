# Builds and tests every push and pull request on Windows (the mod's only
# platform). The Skate engine core needs Skate 3's data and is built by the
# installer on the player's PC; everything else is built and tested here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fivem-rules:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Privacy scanner regression checks
        run: python scripts/test-public-privacy.py
      - name: Verified installer downloads
        shell: powershell
        run: ./scripts/test-installer-downloads.ps1
      - name: Server policy and mocked FiveM integration
        run: node --test fivem/tests/*.test.js
      - name: Isolated FiveM installer regression checks
        shell: powershell
        run: ./scripts/test-fivem-install.ps1
      - name: Story test installer and rollback regression checks
        shell: powershell
        run: ./scripts/test-test-build-install.ps1
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - gta/skate-gta/Cargo.toml
          - gta/skate-ped/Cargo.toml
          - gta/crates/skate_boards/Cargo.toml
          - gta/crates/skate_input/Cargo.toml
          - gta/crates/skate_park/Cargo.toml
          - gta/crates/skate_rules/Cargo.toml
          - gta/crates/skate_sound/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ matrix.manifest }} -> target
      - name: Test
        run: cargo test --release --manifest-path ${{ matrix.manifest }}
