# Weekly update proposals for the pinned CI actions and the Rust crates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directories:
      - /gta/skate-gta
      - /gta/skate-ped
      - /gta/crates/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
