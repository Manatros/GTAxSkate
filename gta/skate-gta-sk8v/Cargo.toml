# SkateGTA.asi on the merged Skate engine: the plugin (../skate-gta/src) with
# its own Skate core, the engine being SK8V's overlay (the mashup's skate
# workspace + SK8V's patches + ours, ../../external/sk8v/build/overlay).
# Replaces ../skate-gta-own (the mashup engine) once confirmed in the game.
[package]
name = "skate-gta"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
name = "skate_gta"
path = "../skate-gta/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["own-core", "asi", "sk8v-engine"]
sk8v-engine = []
asi = []
check-windows = []
own-core = []

[dependencies]
bevy_math = "0.19"
skate-host = { path = "../../external/sk8v/build/overlay/skate/crates/skate-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skate_boards = { path = "../crates/skate_boards" }
skate_input = { path = "../crates/skate_input" }
skate_rules = { path = "../crates/skate_rules" }
skate_park = { path = "../crates/skate_park" }
skate_sound = { path = "../crates/skate_sound" }

[profile.release]
opt-level = 3
codegen-units = 16
