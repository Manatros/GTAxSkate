[package]
name = "skate-gta"
version = "0.1.0"
edition = "2024"
publish = false
description = "Skate 3 for GTA V: the Skate 3 Rust engine's physics, tricks, grinds and animations on the player, as a Script Hook V plugin"
license = "Apache-2.0"

# Its own workspace, like the Skate crates it links.
[workspace]

[lib]
name = "skate_gta"
crate-type = ["cdylib", "rlib"]

[features]
# Type-checks the Windows-only Script Hook V layer on other systems
# (`cargo check --features check-windows`); it is never linked there.
check-windows = []
# Its own SkateGTA.asi (registers with Script Hook V). Off when the core
# links it in and ticks it (`embedded`).
default = ["asi"]
asi = []
# The plugin's own Skate core (the Skate 3 engine, skate-host): built by
# ../skate-gta-own, which adds the engine. Off here: this manifest builds and
# tests everything else without the engine.
own-core = []
# The Skate engine is SK8V's overlay (tags for surfaces), not the mashup's.
sk8v-engine = []

[dependencies]
bevy_math = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skate_boards = { path = "../crates/skate_boards" }
skate_input = { path = "../crates/skate_input" }
skate_rules = { path = "../crates/skate_rules" }
skate_park = { path = "../crates/skate_park" }
skate_sound = { path = "../crates/skate_sound" }

[profile.release]
opt-level = 3
codegen-units = 16
