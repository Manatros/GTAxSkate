[package]
name = "skate-ped"
version = "0.1.0"
edition = "2024"
publish = false
description = "Builds the Skate 3 skater as a GTA V add-on ped (CodeWalker XML) from the player's own converted Skate 3 data"
license = "GPL-3.0-or-later"

# Its own workspace, like the GTA plugin beside it.
[workspace]

[dependencies]
glam = "0.30"
roxmltree = "0.21"
serde_json = "1"
skate_boards = { path = "../crates/skate_boards" }
# Reading the player's deck images (png, jpg, dds, ...).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "dds", "webp"] }

[profile.release]
opt-level = 3

[dev-dependencies]
png = "0.18"
